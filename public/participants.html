<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>등록 현황 — AI 첫발, 함께 내딛다</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <div id="nav"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-12">
    <div class="flex items-end justify-between mb-8 flex-wrap gap-3">
      <div>
        <h1 class="text-3xl font-bold">등록 현황</h1>
        <p class="text-slate-500 mt-1">활동별 등록 결과물입니다. <span id="total" class="font-semibold text-indigo-600"></span></p>
      </div>
      <a href="/register.html" class="bg-indigo-600 text-white font-semibold px-5 py-2.5 rounded-xl hover:bg-indigo-700 transition">+ 등록하기</a>
    </div>

    <div id="content" class="space-y-10">
      <p class="text-slate-400">불러오는 중...</p>
    </div>
  </main>

  <script type="module">
    import { api, renderNav, ACTIVITIES, escapeHtml } from "/js/common.js";
    document.getElementById("nav").innerHTML = renderNav("/participants.html");

    const content = document.getElementById("content");
    const totalEl = document.getElementById("total");

    function card(r) {
      return `
        <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener"
           class="block bg-white rounded-xl border border-slate-100 shadow-sm p-4 hover:shadow-md hover:border-indigo-200 transition">
          <div class="font-semibold">${escapeHtml(r.name)}</div>
          <div class="text-indigo-600 text-sm mt-1 truncate">${escapeHtml(r.url)}</div>
        </a>`;
    }

    try {
      const { registrations } = await api("/api/registrations");
      totalEl.textContent = `총 ${registrations.length}건`;

      if (registrations.length === 0) {
        content.innerHTML = `<p class="text-slate-400">아직 등록된 결과물이 없습니다. 첫 번째로 등록해 보세요!</p>`;
      } else {
        const sections = Object.entries(ACTIVITIES).map(([id, a]) => {
          const items = registrations.filter((r) => Number(r.activity) === Number(id));
          return `
            <section>
              <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span>${a.emoji}</span> ${id}. ${a.label}
                <span class="text-sm font-normal text-slate-400">(${items.length})</span>
              </h2>
              ${
                items.length
                  ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${items.map(card).join("")}</div>`
                  : `<p class="text-slate-400 text-sm">아직 등록된 결과물이 없습니다.</p>`
              }
            </section>`;
        });
        content.innerHTML = sections.join("");
      }
    } catch (err) {
      content.innerHTML = `<p class="text-rose-600">⚠️ ${escapeHtml(err.message)}</p>`;
    }
  </script>
</body>
</html>
