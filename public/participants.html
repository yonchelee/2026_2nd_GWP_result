<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('gwp-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=t}catch(e){}})();</script>
  <title>등록 현황 — AI 첫발, 함께 내딛다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <script defer src="/js/site.js"></script>
</head>
<body class="yl-body">
  <div id="nav"></div>

  <main class="yl-main">
    <section class="yl-band yl-band--tight">
      <div class="yl-wrap--wide">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:40px">
          <div>
            <span class="yl-eyebrow">Participants</span>
            <h1 class="yl-title">등록 현황</h1>
            <p class="yl-sub" style="margin-top:10px">활동별 등록 결과물입니다. <span id="total" class="yl-count"></span></p>
          </div>
          <a href="/register.html" class="yl-btn">+ 등록하기</a>
        </div>

        <div id="content"><p class="yl-sub">불러오는 중...</p></div>
      </div>
    </section>
  </main>

  <footer class="yl-footer">
    <div class="yl-footer__legal">
      <span>© 2026 GWP · AI 첫발, 함께 내딛다</span>
      <span>Design by <a href="https://yonchelee.com" target="_blank" rel="noopener">yonchelee.com</a></span>
    </div>
  </footer>

  <script type="module">
    import { api, renderNav, ACTIVITIES, escapeHtml } from "/js/common.js";
    document.getElementById("nav").innerHTML = renderNav("/participants.html");

    const content = document.getElementById("content");
    const totalEl = document.getElementById("total");

    function card(r) {
      const a = ACTIVITIES[r.activity];
      return `
        <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener" class="yl-card">
          <span class="yl-ic ${a ? a.ic : ""}">${a ? a.emoji : "📦"}</span>
          <div style="min-width:0">
            <div class="name">${escapeHtml(r.name)}</div>
            <div class="desc">${escapeHtml(r.url)}</div>
          </div>
        </a>`;
    }

    try {
      const { registrations } = await api("/api/registrations");
      totalEl.textContent = `총 ${registrations.length}건`;

      if (registrations.length === 0) {
        content.innerHTML = `<p class="yl-sub">아직 등록된 결과물이 없습니다. 첫 번째로 등록해 보세요!</p>`;
      } else {
        content.innerHTML = Object.entries(ACTIVITIES)
          .map(([id, a]) => {
            const items = registrations.filter((r) => Number(r.activity) === Number(id));
            return `
              <section style="margin-bottom:44px">
                <h2 class="yl-headline" style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
                  <span class="yl-ic ${a.ic}">${a.emoji}</span>
                  <span>${id}. ${a.label}</span>
                  <span class="yl-count" style="font-weight:400">(${items.length})</span>
                </h2>
                ${
                  items.length
                    ? `<div class="yl-cards">${items.map(card).join("")}</div>`
                    : `<p class="yl-sub">아직 등록된 결과물이 없습니다.</p>`
                }
              </section>`;
          })
          .join("");
      }
    } catch (err) {
      content.innerHTML = `<p class="yl-msg err">⚠️ ${escapeHtml(err.message)}</p>`;
    }
  </script>
</body>
</html>
