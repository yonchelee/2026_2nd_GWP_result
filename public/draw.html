<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('gwp-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=t}catch(e){}})();</script>
  <title>추첨 (관리자) — AI 첫발, 함께 내딛다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <script defer src="/js/site.js"></script>
  <style>
    /* ===== 추첨기(럭비공 추첨기) 비주얼 ===== */
    .machine { position: relative; width: 340px; max-width: 92vw; margin: 0 auto; }
    .drum-frame {
      position: relative; width: 100%; aspect-ratio: 1 / 0.96;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      background: linear-gradient(160deg, #e2e8f0, #94a3b8);
      padding: 8px; transform-origin: 50% 50%;
    }
    .drum {
      position: relative; width: 100%; height: 100%;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      background:
        radial-gradient(120% 80% at 30% 18%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%),
        linear-gradient(160deg, rgba(186,230,253,.35), rgba(199,210,254,.25));
      overflow: hidden; box-shadow: inset 0 0 30px rgba(255,255,255,.4);
    }
    .balls { position: absolute; inset: 0; transform-origin: 50% 50%; }
    .drum::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(115deg, rgba(255,255,255,.35) 0 18%, transparent 22% 100%);
      pointer-events: none;
    }
    .ball {
      position: absolute; top: 0; left: 0;
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; color: #334155;
      text-align: center; line-height: 1.0; padding: 0 2px;
      overflow: hidden; word-break: break-all;
      box-shadow: inset -5px -6px 9px rgba(0,0,0,.18), inset 4px 4px 7px rgba(255,255,255,.55), 0 2px 4px rgba(0,0,0,.18);
      will-change: transform;
    }
    .ball::before {
      content: ""; position: absolute; top: 6px; left: 8px;
      width: 10px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.7); filter: blur(1px);
    }
    .machine.spinning .drum-frame { animation: drumSpin 1.3s linear infinite; }
    @keyframes drumSpin { to { transform: rotate(360deg); } }
    .machine.spinning .balls { animation: ballsCounter 1.3s linear infinite; }
    @keyframes ballsCounter { to { transform: rotate(-360deg); } }
    .chute {
      position: relative; width: 70%; height: 26px; margin: -6px auto 0;
      background: linear-gradient(180deg, rgba(203,213,225,.5), rgba(148,163,184,.35));
      border: 1px solid rgba(226,232,240,.5); border-top: none;
      clip-path: polygon(18% 0, 82% 0, 100% 100%, 0% 100%);
    }
    .base {
      position: relative; width: 100%; height: 54px; margin-top: -2px;
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      border-radius: 10px 10px 14px 14px;
      box-shadow: inset 0 3px 6px rgba(255,255,255,.25), 0 8px 16px rgba(0,0,0,.4);
    }
    .base::before {
      content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
      width: 56px; height: 16px; background: #0f172a; border-radius: 0 0 8px 8px;
      box-shadow: inset 0 3px 5px rgba(0,0,0,.6);
    }
    .crank {
      position: absolute; right: -18px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 50%; background: #b91c1c;
      box-shadow: 0 0 0 4px #ef4444, 0 0 0 6px #7f1d1d;
    }
    .crank::after {
      content: ""; position: absolute; right: -22px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 6px; border-radius: 3px; background: #9ca3af;
    }
    .machine.spinning .crank { animation: crankSpin 1.3s linear infinite; }
    @keyframes crankSpin { to { transform: translateY(-50%) rotate(360deg); } }

    .tray { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; min-height: 10px; }
    .win-ball { width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .win-ball .orb {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #334155; text-align: center;
      padding: 0 4px; word-break: break-all; line-height: 1.1; position: relative;
      box-shadow: inset -7px -8px 12px rgba(0,0,0,.18), inset 6px 6px 10px rgba(255,255,255,.6), 0 4px 10px rgba(0,0,0,.35);
    }
    .win-ball .orb::before {
      content: ""; position: absolute; top: 11px; left: 14px;
      width: 16px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.7); filter: blur(1px);
    }
    .win-ball .meta { font-size: 11px; color: var(--yl-ink-3); text-align: center; }
    .win-ball .meta .nm { font-weight: 700; color: var(--yl-ink); }
    .drop-ball {
      position: fixed; width: 50px; height: 50px; border-radius: 50%; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #334155; text-align: center;
      padding: 0 4px; word-break: break-all; line-height: 1.1;
      box-shadow: inset -7px -8px 12px rgba(0,0,0,.18), inset 6px 6px 10px rgba(255,255,255,.6), 0 4px 10px rgba(0,0,0,.4);
      pointer-events: none;
    }
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
    #prizeLabel { color: var(--yl-accent-solid); font-weight: 600; }

    /* 2단 레이아웃: 왼쪽 추첨기 / 오른쪽 추첨 기록 */
    .draw-layout{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start;max-width:1024px;margin:0 auto}
    .records{
      position:sticky;top:64px;text-align:left;
      background:var(--yl-bg-elev);border:1px solid var(--yl-hairline-soft);
      border-radius:var(--yl-r);padding:20px;max-height:82vh;overflow:auto;box-shadow:var(--yl-shadow);
    }
    .records h2{font-size:17px;font-weight:700;letter-spacing:-.2px;margin-bottom:14px}
    .rec-item{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--yl-hairline-soft)}
    .rec-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .rec-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:7px}
    .rec-head .pz{font-weight:600;font-size:13px;color:var(--yl-ink)}
    .rec-head .sc{font-family:var(--yl-mono);font-size:10px;color:var(--yl-ink-4);white-space:nowrap}
    .rec-chip{
      display:inline-flex;align-items:center;gap:5px;
      background:var(--yl-bg-band);border:1px solid var(--yl-hairline);
      border-radius:980px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--yl-ink);
    }
    .rec-time{font-family:var(--yl-mono);font-size:10px;color:var(--yl-ink-4);margin-top:7px}
    @media(max-width:860px){
      .draw-layout{grid-template-columns:1fr}
      .records{position:static;max-height:none}
    }
  </style>
</head>
<body class="yl-body">
  <canvas id="confetti"></canvas>
  <div id="nav"></div>

  <main class="yl-main">
    <section class="yl-band yl-band--tight">
      <div class="yl-wrap">
        <div class="yl-sec-head" style="margin-bottom:28px">
          <span class="yl-eyebrow">Prize Draw · Admin</span>
          <h1 class="yl-title">🎰 추첨</h1>
          <p class="yl-sub" style="margin-top:12px">등록자 이름이 적힌 공이 추첨통에서 회전하다 떨어집니다. <span style="opacity:.7">(관리자 전용)</span></p>
        </div>

        <form id="form" class="yl-form">
          <div class="yl-grid-2">
            <div class="yl-field">
              <label for="scope">추첨 범위</label>
              <select id="scope" class="yl-input">
                <option value="all">전체 등록자</option>
                <option value="1">1. AI로 파이썬 프로그램 개발</option>
                <option value="2">2. 웹페이지 개발 & GitHub 등록</option>
                <option value="3">3. AI 어시스턴트 만들기</option>
              </select>
            </div>
            <div class="yl-field">
              <label for="count">당첨 인원</label>
              <input id="count" type="number" min="1" value="1" class="yl-input" />
            </div>
          </div>
          <div class="yl-field">
            <label for="prize">경품 (선택)</label>
            <input id="prize" type="text" class="yl-input" placeholder="예: 스타벅스 기프티콘" />
          </div>
          <div class="yl-field">
            <label for="password">관리자 비밀번호</label>
            <input id="password" type="password" required class="yl-input" />
          </div>
          <button type="submit" id="submit" class="yl-btn yl-btn--accent yl-btn--full">🎲 추첨 시작</button>
          <div id="message" class="yl-msg"></div>
        </form>
      </div>
    </section>

    <section class="yl-band yl-band--soft yl-band--tight" style="padding-top:40px">
      <div class="yl-wrap--wide">
        <div class="draw-layout">
          <!-- 왼쪽: 추첨기 + 현재 추첨 결과 -->
          <div style="text-align:center">
            <div id="poolInfo" class="yl-sub" style="margin-bottom:24px"></div>
            <div class="machine" id="machine">
              <div class="drum-frame">
                <div class="drum"><div class="balls" id="balls"></div></div>
              </div>
              <div class="chute"></div>
              <div class="base"><span class="crank"></span></div>
              <div id="exit" style="position:absolute; left:50%; bottom:40px; width:1px; height:1px;"></div>
            </div>

            <div id="result" style="margin-top:48px;display:none">
              <h2 class="yl-headline" style="margin-bottom:6px">🎉 당첨자 🎉</h2>
              <div id="prizeLabel" style="margin-bottom:24px"></div>
              <div id="tray" class="tray"></div>
            </div>
          </div>

          <!-- 오른쪽: 누적 추첨 기록 -->
          <aside class="records">
            <h2>🏆 추첨 기록</h2>
            <div id="records"><p class="yl-sub">불러오는 중...</p></div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="yl-footer">
    <div class="yl-footer__legal">
      <span>© 2026 GWP · AI 첫발, 함께 내딛다</span>
      <span>Design by <a href="https://yonchelee.com" target="_blank" rel="noopener">yonchelee.com</a></span>
    </div>
  </footer>

  <script type="module">
    import { api, renderNav, ACTIVITIES, escapeHtml } from "/js/common.js";
    document.getElementById("nav").innerHTML = renderNav("/draw.html");

    const COLORS = ["#f9a8d4","#93c5fd","#86efac","#fde68a","#fdba74","#c4b5fd","#67e8f9","#fca5a5","#a7f3d0"];
    const colorFor = (i) => COLORS[i % COLORS.length];
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));
    const rand = (a, b) => a + Math.random() * (b - a);

    const form = document.getElementById("form");
    const submit = document.getElementById("submit");
    const msg = document.getElementById("message");
    const machine = document.getElementById("machine");
    const ballsBox = document.getElementById("balls");
    const exit = document.getElementById("exit");
    const poolInfo = document.getElementById("poolInfo");
    const resultBox = document.getElementById("result");
    const tray = document.getElementById("tray");
    const prizeLabel = document.getElementById("prizeLabel");
    const scopeSel = document.getElementById("scope");
    const recordsBox = document.getElementById("records");

    const shortName = (n) => (n.length > 5 ? n.slice(0, 4) + "…" : n);
    const scopeShort = (s) => (s === "all" ? "전체" : `활동 ${s}`);

    // 오른쪽 누적 추첨 기록 (서버 /api/winners 기준, 새로고침해도 유지)
    async function loadRecords() {
      try {
        const { history } = await api("/api/winners");
        if (!history.length) {
          recordsBox.innerHTML = `<p class="yl-sub">아직 추첨 기록이 없습니다.</p>`;
          return;
        }
        recordsBox.innerHTML = history
          .map((d) => `
            <div class="rec-item">
              <div class="rec-head">
                <span class="pz">${d.prize ? "🎁 " + escapeHtml(d.prize) : "추첨"}</span>
                <span class="sc">${escapeHtml(scopeShort(String(d.scope)))}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                ${d.winners.map((w) => `<span class="rec-chip">${ACTIVITIES[w.activity]?.emoji ?? "🎉"} ${escapeHtml(w.name)}</span>`).join("")}
              </div>
              <div class="rec-time">${escapeHtml(d.drawn_at)}</div>
            </div>`)
          .join("");
      } catch (err) {
        recordsBox.innerHTML = `<p class="yl-msg err">⚠️ ${escapeHtml(err.message)}</p>`;
      }
    }

    // 이미 당첨된(추첨함에서 빠진) 등록자 id 집합 — 풀에서 영구 제외
    let drawnIds = new Set();
    async function loadDrawnIds() {
      try {
        const { history } = await api("/api/winners");
        drawnIds = new Set(history.flatMap((d) => d.winners.map((w) => w.registration_id)));
      } catch { /* 무시 */ }
    }

    /* 드럼 물리 엔진 — 중력 + 벽 반사 + 공끼리 충돌, 회전 시 원심력 + 접선 견인 */
    const BALL_R = 19;
    const GRAVITY = 0.5;
    const REST = 0.55;
    const AIR = 0.992;
    const MAX_V = 22;
    const OMEGA = 0.14;
    let balls = [];
    let spinning = false;
    let physRAF = null;

    function drumGeom() {
      const w = ballsBox.clientWidth || 300;
      const h = ballsBox.clientHeight || 290;
      return { w, h, cx: w / 2, cy: h / 2, R: Math.min(w, h) / 2 - BALL_R - 2 };
    }

    function step() {
      const { cx, cy, R } = drumGeom();
      const n = balls.length;

      for (const b of balls) {
        if (spinning) {
          const dx = b.x - cx, dy = b.y - cy;
          const rr = Math.hypot(dx, dy) || 0.001;
          const nx = dx / rr, ny = dy / rr;
          const tx = -ny, ty = nx;
          const vt = b.vx * tx + b.vy * ty;
          const dvt = (OMEGA * rr - vt) * 0.10;
          const cf = OMEGA * OMEGA * rr * 0.5;
          b.vx += tx * dvt + nx * cf + rand(-0.7, 0.7);
          b.vy += ty * dvt + ny * cf + rand(-0.7, 0.7) + GRAVITY * 0.3;
          b.va += vt * 0.03 + rand(-1.2, 1.2);
        } else {
          b.vy += GRAVITY;
        }
        b.vx *= AIR; b.vy *= AIR;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > MAX_V) { b.vx = (b.vx / sp) * MAX_V; b.vy = (b.vy / sp) * MAX_V; }
        b.x += b.vx; b.y += b.vy;
      }

      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = balls[i], c = balls[j];
          let dx = c.x - a.x, dy = c.y - a.y;
          let d = Math.hypot(dx, dy);
          const min = BALL_R * 2;
          if (d > 0 && d < min) {
            const nx = dx / d, ny = dy / d;
            const overlap = (min - d) / 2;
            a.x -= nx * overlap; a.y -= ny * overlap;
            c.x += nx * overlap; c.y += ny * overlap;
            const dvx = c.vx - a.vx, dvy = c.vy - a.vy;
            const rel = dvx * nx + dvy * ny;
            if (rel < 0) {
              const imp = rel * REST;
              a.vx += imp * nx; a.vy += imp * ny;
              c.vx -= imp * nx; c.vy -= imp * ny;
              a.va += rel * 0.4; c.va -= rel * 0.4;
            }
          }
        }
      }

      for (const b of balls) {
        const dx = b.x - cx, dy = b.y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > R) {
          const nx = dx / dist, ny = dy / dist;
          b.x = cx + nx * R; b.y = cy + ny * R;
          const vdot = b.vx * nx + b.vy * ny;
          b.vx -= (1 + REST) * vdot * nx;
          b.vy -= (1 + REST) * vdot * ny;
          const tx = -ny, ty = nx;
          const vt = b.vx * tx + b.vy * ty;
          b.va = b.va * 0.6 + vt * 0.9;
          b.vx *= 0.985; b.vy *= 0.985;
        }
        b.va *= 0.96;
        b.ang += b.va;
        b.el.style.transform = `translate(${(b.x - BALL_R).toFixed(1)}px, ${(b.y - BALL_R).toFixed(1)}px) rotate(${b.ang.toFixed(1)}deg)`;
      }

      physRAF = requestAnimationFrame(step);
    }
    function startPhysics() { if (!physRAF) physRAF = requestAnimationFrame(step); }

    function removeBallById(id) {
      const idx = balls.findIndex((b) => b.id === id);
      if (idx >= 0) { balls[idx].el.remove(); balls.splice(idx, 1); }
    }

    function renderPool(registrations) {
      ballsBox.innerHTML = "";
      const { cx, cy, R } = drumGeom();
      const avail = registrations.filter((r) => !drawnIds.has(r.id));
      const list = avail.slice(0, 30);
      balls = list.map((r, i) => {
        const el = document.createElement("div");
        el.className = "ball";
        el.style.background = colorFor(i);
        el.title = r.name;
        el.textContent = shortName(r.name);
        ballsBox.appendChild(el);
        const ang = Math.random() * Math.PI * 2;
        const rr = Math.random() * (R - 4);
        return {
          el, id: r.id,
          x: cx + Math.cos(ang) * rr, y: cy + Math.sin(ang) * rr,
          vx: rand(-2, 2), vy: rand(-2, 2),
          ang: rand(0, 360), va: rand(-4, 4),
        };
      });
      const extra = avail.length - list.length;
      poolInfo.textContent = avail.length
        ? `현재 추첨함에 ${avail.length}명의 공이 들어 있어요${extra > 0 ? ` (${list.length}개 표시)` : ""}.`
        : "추첨함이 비어 있어요. (등록자가 없거나 모두 당첨되었습니다)";
      startPhysics();
    }

    async function loadPool() {
      const scope = scopeSel.value;
      const q = scope === "all" ? "" : `?activity=${scope}`;
      try {
        const { registrations } = await api(`/api/registrations${q}`);
        renderPool(registrations);
      } catch (err) {
        poolInfo.textContent = "후보를 불러오지 못했습니다: " + err.message;
      }
    }
    scopeSel.addEventListener("change", loadPool);

    const initScope = new URLSearchParams(location.search).get("scope");
    if (initScope && ["all", "1", "2", "3"].includes(initScope)) {
      scopeSel.value = initScope;
    }

    /* 컨페티 */
    const cvs = document.getElementById("confetti");
    const ctx = cvs.getContext("2d");
    let confetti = [];
    let confRAF = null;
    function sizeCanvas() { cvs.width = innerWidth; cvs.height = innerHeight; }
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);

    function confettiTick() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      for (const p of confetti) {
        p.vy += 0.22; p.vx *= 0.99;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.009;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
        ctx.restore();
      }
      confetti = confetti.filter((p) => p.life > 0 && p.y < cvs.height + 30);
      confRAF = confetti.length ? requestAnimationFrame(confettiTick) : null;
    }
    function burst(x, y, n = 90, spread = 9) {
      for (let i = 0; i < n; i++) {
        confetti.push({
          x, y, vx: rand(-spread, spread), vy: rand(-15, -3),
          s: rand(6, 12), color: COLORS[(Math.random() * COLORS.length) | 0],
          rot: rand(0, 6.28), vr: rand(-0.3, 0.3), life: rand(0.9, 1.4),
        });
      }
      if (!confRAF) confRAF = requestAnimationFrame(confettiTick);
    }

    /* 당첨 공 낙하 + 트레이 적재 (당첨 즉시 드럼에서 제거) */
    async function dropWinner(w, idx) {
      removeBallById(w.id);
      drawnIds.add(w.id);

      const color = colorFor(idx);
      const card = document.createElement("div");
      card.className = "win-ball";
      const a = ACTIVITIES[w.activity];
      card.innerHTML = `
        <div class="orb" style="background:${color}" title="${escapeHtml(w.name)}">${escapeHtml(shortName(w.name))}</div>
        <div class="meta"><span class="nm">${escapeHtml(w.name)}</span><br>${a ? a.emoji + " " + escapeHtml(a.label) : ""}</div>`;
      card.style.visibility = "hidden";
      tray.appendChild(card);

      const orb = card.querySelector(".orb");
      const target = orb.getBoundingClientRect();
      const start = exit.getBoundingClientRect();

      const drop = document.createElement("div");
      drop.className = "drop-ball";
      drop.style.background = color;
      drop.textContent = shortName(w.name);
      const sx = start.left - 25, sy = start.top - 25;
      drop.style.left = sx + "px";
      drop.style.top = sy + "px";
      document.body.appendChild(drop);

      const tx = target.left + target.width / 2 - 25;
      const ty = target.top + target.height / 2 - 25;

      const anim = drop.animate(
        [
          { left: sx + "px", top: sy + "px", offset: 0 },
          { left: sx + "px", top: sy + 34 + "px", offset: 0.32 },
          { left: (sx + tx) / 2 + "px", top: ty - 46 + "px", offset: 0.66 },
          { left: tx + "px", top: ty + "px", offset: 1 },
        ],
        { duration: 1100, easing: "cubic-bezier(.45,.05,.55,1)", fill: "forwards" }
      );
      await anim.finished;
      drop.remove();

      card.style.visibility = "visible";
      card.animate(
        [
          { transform: "scale(.2)", opacity: 0 },
          { transform: "scale(1.18)", opacity: 1, offset: 0.7 },
          { transform: "scale(1)" },
        ],
        { duration: 320, easing: "ease-out" }
      );
      burst(target.left + target.width / 2, target.top + target.height / 2, 70, 7);
      await delay(220);
    }

    function finaleConfetti() {
      burst(cvs.width * 0.5, cvs.height * 0.35, 160, 13);
      setTimeout(() => burst(cvs.width * 0.15, cvs.height * 0.4, 90, 9), 150);
      setTimeout(() => burst(cvs.width * 0.85, cvs.height * 0.4, 90, 9), 300);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "yl-msg";
      submit.disabled = true;
      submit.textContent = "추첨 중...";
      resultBox.style.display = "none";
      tray.innerHTML = "";

      const payload = {
        scope: scopeSel.value,
        count: Number(document.getElementById("count").value),
        prize: document.getElementById("prize").value.trim(),
        password: document.getElementById("password").value,
      };

      machine.classList.add("spinning");
      spinning = true;
      const spinMs = 5000;
      const startedAt = Date.now();

      try {
        const data = await api("/api/draw", {
          method: "POST",
          body: JSON.stringify(payload),
        });

        const remain = Math.max(0, spinMs - (Date.now() - startedAt));
        await delay(remain);
        machine.classList.remove("spinning");
        spinning = false;
        await delay(700);

        prizeLabel.textContent = data.draw.prize ? `🎁 경품: ${data.draw.prize}` : "";
        resultBox.style.display = "block";
        resultBox.scrollIntoView({ behavior: "smooth", block: "center" });

        for (let i = 0; i < data.winners.length; i++) {
          await dropWinner(data.winners[i], i);
        }
        finaleConfetti();

        msg.className = "yl-msg ok";
        msg.textContent = `총 ${data.draw.total_candidates}명 중 ${data.winners.length}명 추첨 완료. (당첨된 공은 추첨함에서 제외됩니다)`;
      } catch (err) {
        machine.classList.remove("spinning");
        spinning = false;
        msg.className = "yl-msg err";
        msg.textContent = "⚠️ " + err.message;
      } finally {
        submit.disabled = false;
        submit.textContent = "🎲 추첨 시작";
        loadPool();
        loadRecords(); // 오른쪽 기록 갱신
      }
    });

    (async () => { await loadDrawnIds(); loadPool(); loadRecords(); })();
  </script>
</body>
</html>
