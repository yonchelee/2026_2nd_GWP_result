<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결과물 등록 — AI 첫발, 함께 내딛다</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <div id="nav"></div>

  <main class="flex-1 max-w-xl w-full mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold mb-2">결과물 등록</h1>
    <p class="text-slate-500 mb-8">참여한 활동을 선택하고 이름과 웹주소를 등록해 주세요. 활동별로 각각 등록할 수 있어요.</p>

    <form id="form" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-6">
      <div>
        <label class="block font-semibold mb-3">참여한 활동</label>
        <div id="activities" class="space-y-2"></div>
      </div>

      <div>
        <label for="name" class="block font-semibold mb-2">이름</label>
        <input id="name" name="name" type="text" maxlength="50" required
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          placeholder="홍길동" />
      </div>

      <div>
        <label for="url" class="block font-semibold mb-2">결과물 웹주소</label>
        <input id="url" name="url" type="url" required
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          placeholder="https://github.com/..." />
        <p class="text-xs text-slate-400 mt-1">http:// 또는 https:// 로 시작하는 주소를 입력하세요.</p>
      </div>

      <button type="submit" id="submit"
        class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition disabled:opacity-50">
        등록하기
      </button>

      <div id="message" class="text-sm"></div>
    </form>

    <p class="text-center mt-6 text-slate-500 text-sm">
      등록 후 <a href="/participants.html" class="text-indigo-600 underline">등록 현황</a>에서 확인할 수 있어요.
    </p>
  </main>

  <script type="module">
    import { api, renderNav, ACTIVITIES } from "/js/common.js";
    document.getElementById("nav").innerHTML = renderNav("/register.html");

    // 활동 라디오 렌더링
    const actBox = document.getElementById("activities");
    actBox.innerHTML = Object.entries(ACTIVITIES)
      .map(([id, a]) => `
        <label class="flex items-center gap-3 border border-slate-200 rounded-lg px-4 py-3 cursor-pointer hover:bg-slate-50 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
          <input type="radio" name="activity" value="${id}" class="accent-indigo-600" ${id === "1" ? "checked" : ""} />
          <span class="text-xl">${a.emoji}</span>
          <span class="font-medium">${id}. ${a.label}</span>
        </label>`)
      .join("");

    const form = document.getElementById("form");
    const msg = document.getElementById("message");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      submit.disabled = true;
      submit.textContent = "등록 중...";

      const activity = Number(form.activity.value);
      const name = form.name.value.trim();
      const url = form.url.value.trim();

      try {
        await api("/api/register", {
          method: "POST",
          body: JSON.stringify({ activity, name, url }),
        });
        msg.className = "text-sm text-emerald-600";
        msg.textContent = "✅ 등록이 완료되었습니다! 다른 활동도 등록할 수 있어요.";
        form.name.value = "";
        form.url.value = "";
      } catch (err) {
        msg.className = "text-sm text-rose-600";
        msg.textContent = "⚠️ " + err.message;
      } finally {
        submit.disabled = false;
        submit.textContent = "등록하기";
      }
    });
  </script>
</body>
</html>
