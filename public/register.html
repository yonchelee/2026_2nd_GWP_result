<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('gwp-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=t}catch(e){}})();</script>
  <title>결과물 등록 — AI 첫발, 함께 내딛다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <script defer src="/js/site.js"></script>
</head>
<body class="yl-body">
  <div id="nav"></div>

  <main class="yl-main">
    <section class="yl-band yl-band--tight">
      <div class="yl-wrap">
        <div class="yl-sec-head" style="margin-bottom:32px">
          <span class="yl-eyebrow">Register</span>
          <h1 class="yl-title">결과물 등록</h1>
          <p class="yl-sub" style="margin-top:12px">참여한 활동을 선택하고 이름과 웹주소를 등록해 주세요. 활동별로 각각 등록할 수 있어요.</p>
        </div>

        <form id="form" class="yl-form">
          <div class="yl-field">
            <label>참여한 활동</label>
            <div id="activities"></div>
          </div>

          <div class="yl-field">
            <label for="name">이름</label>
            <input id="name" name="name" type="text" maxlength="50" required class="yl-input" placeholder="홍길동" />
          </div>

          <div class="yl-field">
            <label for="url">결과물 웹주소</label>
            <input id="url" name="url" type="url" required class="yl-input" placeholder="https://github.com/..." />
            <p class="yl-sub" style="margin-top:6px;font-size:12px">http:// 또는 https:// 로 시작하는 주소를 입력하세요.</p>
          </div>

          <button type="submit" id="submit" class="yl-btn yl-btn--accent yl-btn--full">등록하기</button>
          <div id="message" class="yl-msg"></div>
        </form>

        <p class="yl-sub" style="text-align:center;margin-top:24px">
          등록 후 <a href="/participants.html" class="yl-arrow" style="display:inline-flex">등록 현황</a>에서 확인할 수 있어요.
        </p>
      </div>
    </section>
  </main>

  <footer class="yl-footer">
    <div class="yl-footer__legal">
      <span>© 2026 GWP · AI 첫발, 함께 내딛다</span>
      <span>Design by <a href="https://yonchelee.com" target="_blank" rel="noopener">yonchelee.com</a></span>
    </div>
  </footer>

  <script type="module">
    import { api, renderNav, ACTIVITIES } from "/js/common.js";
    document.getElementById("nav").innerHTML = renderNav("/register.html");

    const actBox = document.getElementById("activities");
    actBox.innerHTML = Object.entries(ACTIVITIES)
      .map(([id, a]) => `
        <label class="yl-radio">
          <input type="radio" name="activity" value="${id}" ${id === "1" ? "checked" : ""} />
          <span class="yl-ic ${a.ic}" style="width:30px;height:30px;font-size:16px">${a.emoji}</span>
          <span class="t">${id}. ${a.label}</span>
        </label>`)
      .join("");

    const form = document.getElementById("form");
    const msg = document.getElementById("message");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "yl-msg";
      submit.disabled = true;
      submit.textContent = "등록 중...";

      const activity = Number(form.activity.value);
      const name = form.name.value.trim();
      const url = form.url.value.trim();

      try {
        await api("/api/register", {
          method: "POST",
          body: JSON.stringify({ activity, name, url }),
        });
        msg.className = "yl-msg ok";
        msg.textContent = "✅ 등록이 완료되었습니다! 다른 활동도 등록할 수 있어요.";
        form.name.value = "";
        form.url.value = "";
      } catch (err) {
        msg.className = "yl-msg err";
        msg.textContent = "⚠️ " + err.message;
      } finally {
        submit.disabled = false;
        submit.textContent = "등록하기";
      }
    });
  </script>
</body>
</html>
